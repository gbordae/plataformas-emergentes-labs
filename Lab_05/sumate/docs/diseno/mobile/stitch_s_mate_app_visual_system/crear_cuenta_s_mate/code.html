<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary": "#ffffff", "surface-container-low": "#fff1e8", "primary-fixed-dim": "#b8d07c", "tertiary": "#8f4d17", "surface-bright": "#fff8f5", "on-secondary-fixed-variant": "#5f4100", "secondary": "#7d5700", "inverse-primary": "#b8d07c", "secondary-fixed-dim": "#f3be5f", "on-tertiary-container": "#753901", "surface-tint": "#52651e", "on-secondary-fixed": "#271900", "secondary-fixed": "#ffdeaa", "background": "#fff8f5", "surface-container-lowest": "#ffffff", "secondary-container": "#ffc969", "on-background": "#231a12", "on-tertiary-fixed-variant": "#713700", "inverse-on-surface": "#ffeee1", "on-error-container": "#93000a", "inverse-surface": "#392e26", "primary-fixed": "#d4ec95", "tertiary-fixed": "#ffdcc6", "surface-container-highest": "#f1dfd2", "on-secondary-container": "#775300", "surface-dim": "#e8d7ca", "error-container": "#ffdad6", "tertiary-container": "#fba567", "surface": "#fff8f5", "on-primary-fixed": "#151f00", "on-primary": "#ffffff", "on-secondary": "#ffffff", "error": "#ba1a1a", "on-primary-container": "#3d5008", "on-surface-variant": "#45483b", "on-tertiary-fixed": "#301400", "surface-container-high": "#f7e5d8", "primary": "#52651e", "outline-variant": "#c6c8b7", "primary-container": "#abc270", "surface-container": "#fdebde", "tertiary-fixed-dim": "#ffb785", "surface-variant": "#f1dfd2", "on-error": "#ffffff", "on-primary-fixed-variant": "#3b4d06", "on-surface": "#231a12", "outline": "#76796a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-md": "1rem", "gutter": "1rem", "space-lg": "1.5rem", "space-xl": "2rem", "space-xs": "0.25rem", "margin": "1.25rem" }, "fontFamily": { "body-sm": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"] }, "fontSize": { "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "700" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface pb-safe"><div class="flex flex-col w-full relative">
<!-- Cabecera Superior Tonal Verde Sabio -->
<div class="relative w-full h-[200px] bg-primary-container rounded-b-[32px] overflow-hidden flex flex-col items-center justify-start pt-6 px-margin">
<!-- Círculos orgánicos sutiles de fondo -->
<div class="absolute -right-8 -top-8 w-44 h-44 rounded-full bg-[#C3D48F]/50 pointer-events-none"></div>
<div class="absolute -left-12 top-10 w-36 h-36 rounded-full bg-[#C3D48F]/40 pointer-events-none"></div>
<div class="absolute right-12 bottom-2 w-20 h-20 rounded-full bg-[#C3D48F]/30 pointer-events-none"></div>
<!-- Icono de Comunidad Universitaria -->
<div class="relative z-10 w-11 h-11 rounded-full bg-[#C3D48F] flex items-center justify-center text-on-surface mb-2 shadow-sm">
<span class="material-symbols-outlined text-[24px]">groups</span>
</div>
<!-- Logotipo "Súmate" con tilde Coral Suave -->
<div class="relative z-10 font-headline-lg text-[36px] leading-[40px] tracking-tight font-extrabold text-[#473C33]">
      S<span class="relative inline-block">u<span class="absolute -top-[11px] left-1/2 -translate-x-1/2 text-tertiary-container font-black text-[22px] leading-none select-none">´</span></span>mate
    </div>
<!-- Lema Institucional -->
<p class="relative z-10 font-headline-sm text-[15px] leading-snug font-medium text-[#473C33] mt-1 text-center">
      Encuentra tu próxima oportunidad
    </p>
</div>
<!-- Contenedor Principal de la Tarjeta con Solapamiento Negativo -->
<div class="w-full px-margin -mt-8 relative z-20 pb-8 flex flex-col">
<!-- Tarjeta Blanca de Registro -->
<div class="w-full bg-surface-container-lowest rounded-[24px] p-5 shadow-sm flex flex-col">
<!-- Selector Segmentado M3 -->
<div class="w-full h-[44px] bg-surface-container rounded-full p-1 flex items-center justify-between gap-1 mb-5">
<button class="flex-1 h-full rounded-full bg-surface-container-lowest flex items-center justify-center text-on-surface-variant font-label-lg text-body-md transition-all" type="button">
          Iniciar sesión
        </button>
<button class="flex-1 h-full rounded-full bg-primary-container flex items-center justify-center gap-1.5 text-[#473C33] font-headline-sm text-body-md shadow-xs" type="button">
<span class="material-symbols-outlined text-[18px]">check</span>
<span>Crear cuenta</span>
</button>
</div>
<!-- Formulario de Registro -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Campo 1: Nombre Completo -->
<div class="flex flex-col gap-1">
<label class="font-headline-sm text-body-sm text-[#473C33] font-semibold px-0.5">
            Nombre completo
          </label>
<div class="relative w-full h-[56px] rounded-xl bg-surface-container-lowest flex items-center px-3.5 focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-[#6B5F54] mr-2.5 text-[22px]">person</span>
<input class="w-full bg-transparent font-body-lg text-on-surface text-[15px] placeholder-[#6B5F54] focus:outline-none" placeholder="Ej. Camila Quispe Mamani" type="text" value="Camila Quispe Mamani"/>
</div>
</div>
<!-- Campo 2: Correo Electrónico -->
<div class="flex flex-col gap-1">
<label class="font-headline-sm text-body-sm text-[#473C33] font-semibold px-0.5">
            Correo electrónico
          </label>
<div class="relative w-full h-[56px] rounded-xl bg-surface-container-lowest flex items-center px-3.5 focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-[#6B5F54] mr-2.5 text-[22px]">mail</span>
<input class="w-full bg-transparent font-body-lg text-on-surface text-[15px] placeholder-[#6B5F54] focus:outline-none" placeholder="cquispe@unsa.edu.pe" type="email"/>
</div>
<p class="font-label-md text-body-sm text-[#6B5F54] px-1 flex items-center gap-1">
<span>Usa tu correo universitario si tienes uno</span>
</p>
</div>
<!-- Campo 3: Contraseña -->
<div class="flex flex-col gap-1">
<label class="font-headline-sm text-body-sm text-[#473C33] font-semibold px-0.5">
            Contraseña
          </label>
<div class="relative w-full h-[56px] rounded-xl bg-surface-container-lowest flex items-center px-3.5 focus-within:shadow-md transition-all">
<span class="material-symbols-outlined text-[#6B5F54] mr-2.5 text-[22px]">lock</span>
<input class="w-full bg-transparent font-body-lg text-on-surface text-[15px] placeholder-[#6B5F54] focus:outline-none" id="password-input" type="password" value="ValleChili2024"/>
<button class="text-[#6B5F54] p-1 rounded-full flex items-center justify-center" onclick="const p = document.getElementById('password-input'); const icon = this.querySelector('span'); if (p.type === 'password') { p.type = 'text'; icon.textContent = 'visibility_off'; } else { p.type = 'password'; icon.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<p class="font-label-md text-body-sm text-[#6B5F54] px-1">
            Mínimo 8 caracteres
          </p>
</div>
<!-- Campo 4: Confirmar Contraseña (Estado de Error) -->
<div class="flex flex-col gap-1">
<label class="font-headline-sm text-body-sm text-[#473C33] font-semibold px-0.5">
            Confirmar contraseña
          </label>
<div class="relative w-full h-[56px] rounded-xl bg-error-container/20 flex items-center px-3.5 shadow-sm">
<span class="material-symbols-outlined text-error mr-2.5 text-[22px]">lock</span>
<input class="w-full bg-transparent font-body-lg text-on-surface text-[15px] focus:outline-none" type="password" value="ValleChili24"/>
<span class="material-symbols-outlined text-error text-[20px]">error</span>
</div>
<!-- Fila de advertencia/error -->
<div class="flex items-center gap-1.5 px-1 pt-0.5 text-error">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-label-md text-body-sm font-semibold">Las contraseñas no coinciden</span>
</div>
</div>
<!-- Casilla de Verificación M3 Términos y Privacidad -->
<label class="flex items-start gap-3 mt-1.5 cursor-pointer select-none">
<div class="relative w-[22px] h-[22px] rounded-[6px] bg-primary-container flex items-center justify-center flex-shrink-0 mt-0.5 shadow-xs">
<input checked="" class="sr-only" type="checkbox"/>
<span class="material-symbols-outlined text-[#473C33] text-[18px] font-bold">check</span>
</div>
<span class="font-headline-sm text-body-md text-[#473C33] leading-snug">
            Acepto los Términos y la Política de privacidad
          </span>
</label>
<!-- Botón Principal Mostaza Claro -->
<button class="w-full h-[52px] mt-2 rounded-xl bg-secondary-container hover:bg-[#E8B355] active:scale-[0.99] transition-all flex items-center justify-center gap-2 text-[#473C33] font-headline-sm text-[16px] shadow-sm" type="button">
<span>Crear cuenta</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Enlace Inferior a Iniciar Sesión -->
<div class="w-full text-center mt-5">
<p class="font-headline-sm text-body-md text-[#6B5F54]">
          ¿Ya tienes cuenta? 
          <a class="text-[#473C33] font-bold underline underline-offset-2 hover:opacity-80 transition-opacity" href="#">
            Inicia sesión
          </a>
</p>
</div>
</div>
<!-- Píldora Institucional de Identidad Regional -->
<div class="w-full flex justify-center mt-6">
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container shadow-xs">
<span class="material-symbols-outlined text-[#473C33] text-[16px]">school</span>
<span class="font-label-md text-body-sm text-[#473C33] tracking-normal">
          Comunidad Universitaria de Arequipa
        </span>
</div>
</div>
</div>
</div></main>
</body></html>
