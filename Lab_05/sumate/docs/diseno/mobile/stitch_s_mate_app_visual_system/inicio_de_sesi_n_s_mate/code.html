<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary": "#ffffff", "surface-container-low": "#fff1e8", "primary-fixed-dim": "#b8d07c", "tertiary": "#8f4d17", "surface-bright": "#fff8f5", "on-secondary-fixed-variant": "#5f4100", "secondary": "#7d5700", "inverse-primary": "#b8d07c", "secondary-fixed-dim": "#f3be5f", "on-tertiary-container": "#753901", "surface-tint": "#52651e", "on-secondary-fixed": "#271900", "secondary-fixed": "#ffdeaa", "background": "#fff8f5", "surface-container-lowest": "#ffffff", "secondary-container": "#ffc969", "on-background": "#231a12", "on-tertiary-fixed-variant": "#713700", "inverse-on-surface": "#ffeee1", "on-error-container": "#93000a", "inverse-surface": "#392e26", "primary-fixed": "#d4ec95", "tertiary-fixed": "#ffdcc6", "surface-container-highest": "#f1dfd2", "on-secondary-container": "#775300", "surface-dim": "#e8d7ca", "error-container": "#ffdad6", "tertiary-container": "#fba567", "surface": "#fff8f5", "on-primary-fixed": "#151f00", "on-primary": "#ffffff", "on-secondary": "#ffffff", "error": "#ba1a1a", "on-primary-container": "#3d5008", "on-surface-variant": "#45483b", "on-tertiary-fixed": "#301400", "surface-container-high": "#f7e5d8", "primary": "#52651e", "outline-variant": "#c6c8b7", "primary-container": "#abc270", "surface-container": "#fdebde", "tertiary-fixed-dim": "#ffb785", "surface-variant": "#f1dfd2", "on-error": "#ffffff", "on-primary-fixed-variant": "#3b4d06", "on-surface": "#231a12", "outline": "#76796a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-md": "1rem", "gutter": "1rem", "space-lg": "1.5rem", "space-xl": "2rem", "space-xs": "0.25rem", "margin": "1.25rem" }, "fontFamily": { "body-sm": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"] }, "fontSize": { "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg": ["34px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "600" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "title-md": ["16px", { "lineHeight": "22px", "fontWeight": "700" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface pb-safe"><div class="flex flex-col w-full select-none" style="background-color: #FBF8F1; min-height: 844px; max-width: 390px; margin: 0 auto;">
<!-- CABECERA SUPERIOR VERDE SABIO -->
<header class="relative w-full h-[256px] rounded-b-[32px] overflow-hidden flex flex-col items-center justify-center px-6" style="background-color: #ABC270;">
<!-- Formas orgánicas sutiles decorativas (#C3D48F) -->
<div class="absolute -top-10 -right-8 w-44 h-44 rounded-full pointer-events-none opacity-60" style="background-color: #C3D48F;"></div>
<div class="absolute top-16 -left-12 w-36 h-36 rounded-full pointer-events-none opacity-50" style="background-color: #C3D48F;"></div>
<div class="absolute -bottom-10 right-1/4 w-32 h-32 rounded-full pointer-events-none opacity-40" style="background-color: #C3D48F;"></div>
<!-- Contenido de Marca Centrado -->
<div class="relative z-10 flex flex-col items-center text-center -mt-6">
<!-- Isotipo / Icono Sutil de Comunidad & Oportunidad -->
<div class="w-11 h-11 rounded-full flex items-center justify-center mb-2" style="background-color: #EEF3DC;">
<span class="material-symbols-rounded text-[24px]" style="color: #473C33;">diversity_3</span>
</div>
<!-- Logotipo tipográfico Súmate -->
<div class="flex items-center tracking-tight leading-none" style="font-family: 'Plus Jakarta Sans', sans-serif;">
<span class="text-[40px] font-extrabold" style="color: #473C33;">S</span>
<!-- U con acento estilizado en Coral Suave #FDA769 -->
<span class="relative inline-flex items-center text-[40px] font-extrabold" style="color: #473C33;">
          u
          <span class="absolute -top-2 left-1/2 -translate-x-1/2 text-[26px] font-extrabold leading-none" style="color: #FDA769;">´</span>
</span>
<span class="text-[40px] font-extrabold" style="color: #473C33;">mate</span>
</div>
<!-- Lema Institucional -->
<p class="mt-1.5 text-[15px] font-medium tracking-normal" style="font-family: 'Plus Jakarta Sans', sans-serif; color: #473C33;">
        Encuentra tu próxima oportunidad
      </p>
</div>
</header>
<!-- TARJETA PRINCIPAL SUPERPUESTA -->
<main class="relative z-20 mx-4 -mt-11 rounded-[24px] p-6 shadow-sm" style="background-color: #FFFFFF; border: 1px solid #E5E0D3;">
<!-- a) Selector segmentado M3 -->
<div class="w-full h-[44px] rounded-full p-[3px] flex items-center" style="background-color: #FFFFFF; border: 1px solid #E5E0D3;">
<!-- Opción 1: Iniciar Sesión (Seleccionada) -->
<button class="flex-1 h-full rounded-full flex items-center justify-center gap-1.5 transition-all" id="tab-login" style="background-color: #ABC270;" type="button">
<span class="material-symbols-rounded text-[18px]" style="color: #473C33; font-variation-settings: 'FILL' 1;">check</span>
<span class="text-[13px] font-bold" style="font-family: 'Plus Jakarta Sans', sans-serif; color: #473C33;">Iniciar sesión</span>
</button>
<!-- Opción 2: Crear Cuenta -->
<button class="flex-1 h-full rounded-full flex items-center justify-center transition-all bg-transparent" id="tab-register" type="button">
<span class="text-[13px] font-medium" style="font-family: 'Plus Jakarta Sans', sans-serif; color: #6B5F54;">Crear cuenta</span>
</button>
</div>
<!-- Formulario -->
<form class="mt-5 flex flex-col" onsubmit="event.preventDefault();">
<!-- Campo 1: Correo electrónico (Estado enfocado visual M3) -->
<div class="relative w-full">
<!-- Etiqueta Flotante -->
<label class="absolute -top-2.5 left-3.5 px-1.5 text-[12px] font-semibold rounded" for="email-field" style="background-color: #FFFFFF; color: #473C33; font-family: 'Plus Jakarta Sans', sans-serif;">
          Correo electrónico
        </label>
<div class="w-full h-[54px] rounded-[12px] flex items-center px-3.5 transition-colors" style="background-color: #FFFFFF; border: 2px solid #473C33;">
<span class="material-symbols-rounded text-[20px] mr-2.5 flex-shrink-0" style="color: #473C33;">alternate_email</span>
<input autocomplete="email" class="w-full bg-transparent border-0 p-0 text-[14px] font-medium focus:outline-none" id="email-field" style="color: #473C33; font-family: 'Plus Jakarta Sans', sans-serif;" type="email" value="tucorreo@universidad.edu.pe">
</div>
</div>
<!-- Campo 2: Contraseña -->
<div class="relative w-full mt-4">
<!-- Etiqueta Contenedora -->
<label class="absolute -top-2.5 left-3.5 px-1.5 text-[12px] font-medium rounded" for="pass-field" style="background-color: #FFFFFF; color: #6B5F54; font-family: 'Plus Jakarta Sans', sans-serif;">
          Contraseña
        </label>
<div class="w-full h-[54px] rounded-[12px] flex items-center px-3.5" style="background-color: #FFFFFF; border: 1px solid #E5E0D3;">
<span class="material-symbols-rounded text-[20px] mr-2.5 flex-shrink-0" style="color: #6B5F54;">lock</span>
<input class="w-full bg-transparent border-0 p-0 text-[14px] font-medium tracking-widest focus:outline-none" id="pass-field" style="color: #473C33; font-family: 'Plus Jakarta Sans', sans-serif;" type="password" value="MiClaveSegura2025">
<button aria-label="Mostrar u ocultar contraseña" class="w-9 h-9 flex items-center justify-center -mr-1.5 rounded-full active:bg-[#FBF8F1] transition-colors" id="toggle-password" type="button">
<span class="material-symbols-rounded text-[20px]" id="eye-icon" style="color: #6B5F54;">visibility</span>
</button>
</div>
</div>
<!-- c) Enlace ¿Olvidaste tu contraseña? -->
<div class="flex justify-end mt-1">
<a class="inline-flex items-center h-10 text-[13px] font-semibold underline underline-offset-4 active:opacity-70 transition-opacity" href="#recuperar" style="color: #473C33; font-family: 'Plus Jakarta Sans', sans-serif;">
          ¿Olvidaste tu contraseña?
        </a>
</div>
<!-- d) Botón de acción principal Mostaza Claro #FEC868 -->
<button class="w-full h-[52px] mt-2 rounded-[12px] flex items-center justify-center gap-2 active:brightness-95 transition-all shadow-none" id="btn-submit" style="background-color: #FEC868;" type="submit">
<span class="text-[16px] font-extrabold tracking-tight" id="btn-text" style="color: #473C33; font-family: 'Plus Jakarta Sans', sans-serif;">
          Iniciar sesión
        </span>
<span class="material-symbols-rounded text-[20px]" style="color: #473C33;">arrow_forward</span>
</button>
</form>
</main>
<!-- 3. SECCIÓN INFERIOR -->
<footer class="w-full flex-1 flex flex-col items-center justify-between px-6 pt-4 pb-6 text-center">
<!-- Fila de Registro Alternativo -->
<div class="flex items-center justify-center gap-1.5 py-1">
<span class="text-[14px]" style="color: #6B5F54; font-family: 'Plus Jakarta Sans', sans-serif;">
        ¿Aún no tienes cuenta?
      </span>
<button class="text-[14px] font-bold underline underline-offset-4 active:opacity-75 transition-opacity" id="link-register" style="color: #473C33; font-family: 'Plus Jakarta Sans', sans-serif;" type="button">
        Regístrate
      </button>
</div>
<!-- Micro Badge Cívico Arequipa -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full" style="background-color: #EEF3DC;">
<span class="material-symbols-rounded text-[14px]" style="color: #473C33;">school</span>
<span class="text-[11px] font-bold" style="color: #473C33; font-family: 'Plus Jakarta Sans', sans-serif;">Comunidad Universitaria de Arequipa</span>
</div>
<!-- Términos y privacidad legales -->
<p class="text-[11px] leading-[16px] max-w-[290px] mx-auto mt-2" style="color: #6B5F54; font-family: 'Plus Jakarta Sans', sans-serif;">
      Al continuar aceptas los <a class="underline" href="#terminos" style="color: #473C33;">Términos</a> y la <a class="underline" href="#privacidad" style="color: #473C33;">Política de privacidad</a> de Súmate.
    </p>
</footer>
</div>
<script>
  (function () {
    var passInput = document.getElementById('pass-field');
    var toggleBtn = document.getElementById('toggle-password');
    var eyeIcon = document.getElementById('eye-icon');
    var tabLogin = document.getElementById('tab-login');
    var tabRegister = document.getElementById('tab-register');
    var linkRegister = document.getElementById('link-register');
    var btnText = document.getElementById('btn-text');

    // Toggle de visibilidad de contraseña
    if (toggleBtn && passInput && eyeIcon) {
      toggleBtn.addEventListener('click', function () {
        var isPassword = passInput.getAttribute('type') === 'password';
        passInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // Toggle ligero de tabs Material 3
    function setMode(mode) {
      if (mode === 'register') {
        tabLogin.style.backgroundColor = 'transparent';
        tabLogin.innerHTML = '<span class="text-[13px] font-medium" style="font-family: \'Plus Jakarta Sans\', sans-serif; color: #6B5F54;">Iniciar sesión</span>';
        
        tabRegister.style.backgroundColor = '#ABC270';
        tabRegister.innerHTML = '<span class="material-symbols-rounded text-[18px]" style="color: #473C33; font-variation-settings: \'FILL\' 1;">check</span><span class="text-[13px] font-bold" style="font-family: \'Plus Jakarta Sans\', sans-serif; color: #473C33;">Crear cuenta</span>';
        
        if (btnText) btnText.textContent = 'Crear cuenta universitaria';
      } else {
        tabRegister.style.backgroundColor = 'transparent';
        tabRegister.innerHTML = '<span class="text-[13px] font-medium" style="font-family: \'Plus Jakarta Sans\', sans-serif; color: #6B5F54;">Crear cuenta</span>';
        
        tabLogin.style.backgroundColor = '#ABC270';
        tabLogin.innerHTML = '<span class="material-symbols-rounded text-[18px]" style="color: #473C33; font-variation-settings: \'FILL\' 1;">check</span><span class="text-[13px] font-bold" style="font-family: \'Plus Jakarta Sans\', sans-serif; color: #473C33;">Iniciar sesión</span>';
        
        if (btnText) btnText.textContent = 'Iniciar sesión';
      }
    }

    if (tabRegister) {
      tabRegister.addEventListener('click', function () { setMode('register'); });
    }
    if (tabLogin) {
      tabLogin.addEventListener('click', function () { setMode('login'); });
    }
    if (linkRegister) {
      linkRegister.addEventListener('click', function () { setMode('register'); });
    }
  })();
</script></main>

</body></html>
